<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        const theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);

        // Listen for PWA beforeinstallprompt early to avoid missing the event
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          window.deferredPrompt = e;
          window.dispatchEvent(new CustomEvent('pwa-prompt-ready', { detail: e }));
        });
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ff9f0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TanCoreLab" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="https://tancorelab.com/" />

    <meta property="og:title" content="TanCoreLab — Görev, CRM ve Ekip Yönetim Platformu" />
    <meta property="og:description" content="TanCoreLab ile görevlerinizi takip edin, CRM süreçlerinizi yönetin, günlük raporlar oluşturun ve ekip operasyonlarını tek çalışma alanından yönetin." />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TanCoreLab — Görev, CRM ve Ekip Yönetim Platformu" />
    <meta name="twitter:description" content="TanCoreLab ile görevlerinizi takip edin, CRM süreçlerinizi yönetin, günlük raporlar oluşturun ve ekip operasyonlarını tek çalışma alanından yönetin." />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        let swRegistration = null;

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            swRegistration = reg;
            reg.update();

            // ── Yeni SW bulunduğunda güncelleme hazır bayrağı ─────────────
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // Yeni versiyon var! Uygulamayı bilgilendir
                  window.dispatchEvent(new CustomEvent('sw-update-available', {
                    detail: { registration: reg }
                  }));
                }
              });
            });
          }).catch((err) => {
            console.error('ServiceWorker registration failed: ', err);
          });
        });

        // ── İOS PWA için kritik: Sekme görünür olduğunda güncelleme kontrol et ─
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden && swRegistration) {
            swRegistration.update();
          }
        });

        // ── Yeni SW kontrolü ele geçirdiğinde sayfayı yenile ─────────────────
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
    </script>
  </body>
</html>
